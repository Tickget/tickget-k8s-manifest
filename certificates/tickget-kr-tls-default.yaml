# TLS Certificate for tickget.kr (default namespace)
# This certificate is used by global IngressRoutes in default namespace
# Automatically renewed by cert-manager using Let's Encrypt
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tickget-kr-tls
  namespace: default
spec:
  # DNS names covered by this certificate
  dnsNames:
    - tickget.kr
    - www.tickget.kr

  # ClusterIssuer reference (Let's Encrypt Production)
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod

  # Renew certificate 15 days (360h) before expiration
  renewBefore: 360h

  # Secret name where the TLS certificate will be stored
  # This secret will be created in the 'default' namespace
  secretName: tickget-kr-tls
