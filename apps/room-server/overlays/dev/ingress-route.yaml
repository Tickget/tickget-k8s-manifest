apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: room-server-route
  namespace: dev
spec:
  entryPoints:
    - websecure  # HTTPS
  routes:
    # WebSocket 엔드포인트 - 인증 제외 (SockJS/STOMP 연결용)
    # 경로: /api/v1/dev/rms/ws/*
    # ⚠️ WebSocket은 STOMP CONNECT 프레임에서 별도 인증 처리
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/dev/rms/ws`)
      kind: Rule
      priority: 250  # room-server REST API보다 높은 우선순위 (더 구체적인 경로)
      services:
        - name: room-server-service
          port: 80
          namespace: dev
          # ✅ Sticky Session 설정 (Cookie 기반)
          # WebSocket 연결을 동일한 Pod으로 유지
          sticky:
            cookie:
              name: room_server_affinity
              secure: true
              httpOnly: true
              sameSite: lax
      middlewares:
        - name: room-server-middleware  # StripPrefix만 적용 (인증 없음)
          namespace: dev

    # 방 목록 조회 및 방 상세 조회 - 인증 제외 (공개 API)
    # 경로: GET /api/v1/dev/rms/rooms, GET /api/v1/dev/rms/rooms/{roomId}
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/dev/rms/rooms`) && Method(`GET`)
      kind: Rule
      priority: 240  # REST API보다 높은 우선순위 (더 구체적인 경로)
      services:
        - name: room-server-service
          port: 80
          namespace: dev
          # ✅ Sticky Session 설정 (WebSocket과 동일한 Pod으로 라우팅)
          sticky:
            cookie:
              name: room_server_affinity
              secure: true
              httpOnly: true
              sameSite: lax
      middlewares:
        - name: room-server-middleware  # StripPrefix만 적용 (인증 없음)
          namespace: dev

    # Room Server REST API - ForwardAuth 적용
    # 경로: /api/v1/dev/rms/* (WebSocket, 방 조회 제외)
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/dev/rms`)
      kind: Rule
      priority: 200  # 낮은 우선순위 (나머지 모든 경로)
      services:
        - name: room-server-service
          port: 80
          namespace: dev
          # ✅ Sticky Session 설정 (WebSocket과 동일한 Pod으로 라우팅)
          sticky:
            cookie:
              name: room_server_affinity
              secure: true
              httpOnly: true
              sameSite: lax
      middlewares:
        - name: auth-middleware         # 1. 먼저 인증 확인 (ForwardAuth)
          namespace: dev
        - name: room-server-middleware  # 2. 경로 수정 (StripPrefix)
          namespace: dev

  # TLS (HTTPS) 설정
  tls:
    secretName: tickget-kr-tls
    # Secret은 default 네임스페이스에 있지만, Traefik이 자동으로 찾음
    namespace: dev