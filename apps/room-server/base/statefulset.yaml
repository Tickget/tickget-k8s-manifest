apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: room-server
spec:
  serviceName: "room-server-service"  # StatefulSet에 필수
  replicas: 2
  selector:
    matchLabels:
      app: room-server
  # StatefulSet은 updateStrategy 사용 (Deployment의 strategy와 다름)
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0  # 0번부터 순차 업데이트 (StatefulSet 기본값)
  # Pod 이름 패턴: room-server-0, room-server-1, room-server-2...
  template:
    metadata:
      labels:
        app: room-server
    spec:
      # Worker1 노드에 고정
      nodeSelector:
        kubernetes.io/hostname: worker1

      containers:
      - name: room-server
        image: kkaebu/room-server
        imagePullPolicy: Always  # 항상 최신 이미지를 pull
        ports:
        - containerPort: 8080
        env:
        - name: TZ
          value: "Asia/Seoul"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name  # room-server-0, room-server-1...
        envFrom:
          - configMapRef:
              name: room-server-config
          - secretRef:
              name: room-server-secret
        resources:
          requests:
            memory: "768Mi"  # WebSocket 세션 증가 대비
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
  # podManagementPolicy: Parallel로 설정하면 모든 Pod를 동시에 시작 (기본값: OrderedReady)
  podManagementPolicy: Parallel
