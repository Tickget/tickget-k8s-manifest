apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-server-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # 새 Pod를 추가로 생성하지 않음 (리소스 절약)
      maxUnavailable: 1  # 한 번에 1개씩만 업데이트
  selector:
    matchLabels:
      app: room-server
  template:
    metadata:
      labels:
        app: room-server
    spec:
      containers:
      - name: room-server
        image: kkaebu/room-server
        imagePullPolicy: Always  # 항상 최신 이미지를 pull
        ports:
        - containerPort: 8080
        env:
        - name: TZ  
          value: "Asia/Seoul"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
          - configMapRef:
              name: room-server-config
          - secretRef:
              name: room-server-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5         # 추가
          failureThreshold: 3       # 추가
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 15
          timeoutSeconds: 5         # 추가
          failureThreshold: 3       # 추가
