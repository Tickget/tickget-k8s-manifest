apiVersion: v1
kind: ConfigMap
metadata:
  name: captcha-server-config
data:
  # API Version
  API_VERSION: "v1.0"

  # Database (SQLite - 파일 기반 로컬 DB)
  # 운영 환경에서는 SQLite를 사용하므로 별도의 외부 DB 연결 불필요
  # 파일은 컨테이너 내부 /app 디렉토리에 생성됨
  SQLALCHEMY_DATABASE_URI: "sqlite:///test.db"

  # CAPTCHA Font 설정
  DEFAULT_CAPTCHA_FONT: "DejaVuSerif.ttf"

  # Celery 설정 (백그라운드 작업 - 현재 비활성화)
  USE_CELERY: "False"

  # Redis (클러스터 내부 - default 네임스페이스)
  # Celery가 활성화되면 사용됨
  CELERY_BROKER_URL: "redis://redis-service.default.svc.cluster.local:6379"
  CELERY_RESULT_BACKEND: "redis://redis-service.default.svc.cluster.local:6379"
