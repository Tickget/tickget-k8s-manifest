apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-server-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # 새 Pod를 추가로 생성하지 않음 (리소스 절약)
      maxUnavailable: 1  # 한 번에 1개씩만 업데이트
  selector:
    matchLabels:
      app: user-server
  template:
    metadata:
      labels:
        app: user-server
    spec:
      containers:
      - name: user-server
        image: kkaebu/user-server
        imagePullPolicy: Always
        ports:
        - containerPort: 8084
        env:
        - name: TZ
          value: "Asia/Seoul"
        envFrom:
          - configMapRef:
              name: user-server-config
          - secretRef:
              name: user-server-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "800Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 180
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 210
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
