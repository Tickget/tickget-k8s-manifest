apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-server-config
data:
  # Server
  SERVER_PORT: "8080"

  # MySQL (외부 Azure DB - 공통 S13P31A209 DB 사용)
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
  SPRING_DATASOURCE_URL: "jdbc:mysql://ssafy-mysql-db.mysql.database.azure.com:3306/S13P31A209?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true"

  # MongoDB (외부 Azure DB - 로그 저장용)
  # ticketing_logs는 MongoDB 내부의 collection, DB는 S13P31A209 사용
  SPRING_DATA_MONGODB_URI: "mongodb+srv://S13P31A209:tickget209@ssafy.ngivl.mongodb.net/S13P31A209?authSource=admin"
  SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "true"

  # Redis (클러스터 내부 - default 네임스페이스)
  SPRING_DATA_REDIS_HOST: "redis-service.default.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_TIMEOUT: "3000ms"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: "20"
  SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: "10"
  SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: "5"

  # JPA
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_PROPERTIES_HIBERNATE_SHOW_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
  SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_JPA_OPEN_IN_VIEW: "false"

  # Kafka (클러스터 내부 - default 네임스페이스)
  SPRING_KAFKA_BOOTSTRAP-SERVERS: "kafka-service.default.svc.cluster.local:9092"
  SPRING_KAFKA_CONSUMER_GROUP-ID: "ticketing-service-dev"
  SPRING_KAFKA_CONSUMER_AUTO-OFFSET-RESET: "earliest"
  SPRING_KAFKA_CONSUMER_KEY-DESERIALIZER: "org.apache.kafka.common.serialization.StringDeserializer"
  SPRING_KAFKA_CONSUMER_VALUE-DESERIALIZER: "org.springframework.kafka.support.serializer.JsonDeserializer"
  SPRING_KAFKA_CONSUMER_PROPERTIES_SPRING_JSON_TRUSTED-PACKAGES: "com.ticketing.seat.event"
  SPRING_KAFKA_PRODUCER_KEY-SERIALIZER: "org.apache.kafka.common.serialization.StringSerializer"
  SPRING_KAFKA_PRODUCER_VALUE-SERIALIZER: "org.springframework.kafka.support.serializer.JsonSerializer"
  SPRING_KAFKA_PRODUCER_PROPERTIES_SPRING_JACKSON_DATE-FORMAT: "yyyy-MM-dd HH:mm:ss"
  # QueueTopicProps (QueueTopicConfig, QueueTopicReconciler)가 사용하는 설정
  APP_KAFKA_TOPICS_QUEUE_NAME: "user-log"
  APP_KAFKA_TOPICS_QUEUE_PARTITIONS: "3"
  APP_KAFKA_TOPICS_QUEUE_REPLICAS: "1"

  # Logging
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: "debug"
  LOGGING_LEVEL_COM_TICKETING: "info"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB_CORE_MONGOTEMPLATE: "debug"
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_KAFKA: "info"

  # Actuator (Spring Boot 모니터링)
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"

  # Captcha (TODO: captcha-server 배포 후 업데이트 필요)
  # 현재는 더미 값 또는 미사용 상태로 설정
  CAPTCHA_ADDRESS: "http://captcha-server-service.dev.svc.cluster.local:8080/api/v1.0/captcha/"
  CAPTCHA_TIMEOUT: "5000"
