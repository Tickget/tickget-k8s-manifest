apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketing-server-config
data:
  # Server
  SERVER_PORT: "8080"
  SPRING_APP_NAME: "ticketing-server"

  # MySQL (외부 Azure DB - 공통 S13P31A209 DB 사용)
  DB_URL: "jdbc:mysql://ssafy-mysql-db.mysql.database.azure.com:3306/S13P31A209?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=true"

  # MongoDB (외부 Azure DB - 로그 저장용)
  MONGO_URI: "mongodb+srv://S13P31A209:tickget209@ssafy.ngivl.mongodb.net/S13P31A209?authSource=admin"
  MONGO_DATABASE: "S13P31A209"
  MONGO_AUTO_INDEX: "true"

  # Redis (클러스터 내부 - default 네임스페이스)
  REDIS_HOST: "redis-service.default.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "3000ms"
  REDIS_POOL_MAX_ACTIVE: "20"
  REDIS_POOL_MAX_IDLE: "10"
  REDIS_POOL_MIN_IDLE: "5"

  # JPA
  JPA_DDL_AUTO: "update"
  HIBERNATE_SHOW_SQL: "false"
  HIBERNATE_FORMAT_SQL: "true"
  HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_OPEN_IN_VIEW: "false"

  # Kafka (클러스터 내부 - default 네임스페이스)
  KAFKA_BOOTSTRAP: "kafka-service.default.svc.cluster.local:9092"
  JACKSON_DATE_FORMAT: "yyyy-MM-dd HH:mm:ss"
  KAFKA_CONSUMER_AUTO_OFFSET_RESET: "latest"
  KAFKA_ENABLE_AUTO_COMMIT: "false"
  KAFKA_TRUSTED_PACKAGES: "com.ticketing.seat.event"
  KAFKA_VALUE_DEFAULT_TYPE: "com.ticketing.seat.event.SeatConfirmationEvent"
  KAFKA_ACK_MODE: "MANUAL_IMMEDIATE"

  # Kafka Admin & Topics
  APP_KAFKA_BOOTSTRAP: "kafka-service.default.svc.cluster.local:9092"
  KAFKA_ADMIN_AUTO_CREATE: "true"
  KAFKA_ADMIN_CLIENT_ID: "kafka-admin"
  TOPIC_USER_LOG: "user-log"
  TOPIC_USER_LOG_PARTITIONS: "3"
  TOPIC_USER_LOG_REPLICAS: "1"
  TOPIC_CAPTCHA_LOG: "captcha-log"
  TOPIC_CAPTCHA_LOG_PARTITIONS: "3"
  TOPIC_CAPTCHA_LOG_REPLICAS: "1"

  # Task Scheduling
  SCHEDULING_POOL_SIZE: "4"

  # Logging
  LOG_SQL_LEVEL: "warn"
  LOG_APP_LEVEL: "info"
  LOG_MONGO_LEVEL: "debug"
  LOG_KAFKA_LEVEL: "info"

  # Actuator (Spring Boot 모니터링)
  ACTUATOR_EXPOSE: "health,info,prometheus"
  ACTUATOR_HEALTH_DETAILS: "always"

  # Captcha (captcha-server - 클러스터 내부 - dev 네임스페이스)
  CAPTCHA_ADDRESS: "http://captcha-server-service.dev.svc.cluster.local:80/api/v1.0/captcha/"
  CAPTCHA_TIMEOUT: "5000"

  # Bot 서버 주소
  BOT_SERVICE_URL: "http://bot-server-service.dev.svc.cluster.local:80"

  # Room 서버 주소
  ROOM_SERVICE_URL: "http://room-server-service.dev.svc.cluster.local"
