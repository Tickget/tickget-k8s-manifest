apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketing-server-deployment
spec:
  replicas: 2 # 2개의 파드로 실행 (안정성)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # 새 Pod를 추가로 생성하지 않음 (리소스 절약)
      maxUnavailable: 1  # 한 번에 1개씩만 업데이트
  selector:
    matchLabels:
      app: ticketing-server
  template:
    metadata:
      labels:
        app: ticketing-server
    spec:
      containers:
      - name: ticketing-server
        # 1단계에서 푸시한 Docker Hub 이미지 (태그는 overlays에서 지정)
        image: kkaebu/ticketing-server
        # kustomize가 관리할 것이기에 삭제제
        imagePullPolicy: Always # 항상 최신 이미지를 받음
        ports:
        - containerPort: 8080 # Spring Boot 기본 포트
        env:
        - name: TZ  
          value: "Asia/Seoul"
        envFrom:
          # ConfigMap의 모든 데이터를 환경변수로 주입
          - configMapRef:
              name: ticketing-server-config
          # Secret의 모든 데이터를 환경변수로 주입
          - secretRef:
              name: ticketing-server-secret
        resources:
          requests: # 최소 보장 리소스
            memory: "700Mi"
            cpu: "400m"
          limits: # 최대 사용 가능 리소스 (최적화)
            memory: "1536Mi"  # 2Gi → 1.5Gi (25% 절감)
            cpu: "600m"       # 800m → 600m (25% 절감)
        # 헬스 체크 설정 (Spring Boot Actuator 사용)
        readinessProbe: # 파드가 요청을 받을 준비가 되었는지
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120 # 시작 후 120초 대기
          periodSeconds: 10 # 10초마다 체크
          timeoutSeconds: 5         # 추가
          failureThreshold: 3       # 추가
        livenessProbe: # 파드가 살아있는지 (죽었으면 재시작)
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 150 # 시작 후 150초 대기
          periodSeconds: 15
          timeoutSeconds: 5         # 추가
          failureThreshold: 3       # 추가