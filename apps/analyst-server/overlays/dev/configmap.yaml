apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-server-config
data:
  # ===== Local / Server DB Switching =====
  USE_LOCAL_ENV: "false"  # Kubernetes에서는 서버 DB 사용

  # ===== Minimum Session Count ===== 
  MIN_SESSIONS_FOR_ANALYSIS: "5"

  # ===== MySQL (클러스터 내부 - db 네임스페이스) =====
  MYSQL_HOST: "mysql.db.svc.cluster.local"
  MYSQL_PORT: "3306"
  MYSQL_DB: "tickget_db"
  MYSQL_USER: "tickget"
  MYSQL_URL: "mysql+mysqlconnector://tickget:hiiiiky@mysql.db.svc.cluster.local:3306/tickget_db"

  # ===== MongoDB (클러스터 내부 - db 네임스페이스) =====
  MONGO_URI: "mongodb://tickget:hiiiiky@mongodb.db.svc.cluster.local:27017/ticketing_db?authSource=admin"
  MONGO_DB: "ticketing_db"

  # ===== Json Save Path =====
  BOT_PARAM_OUT: "/tmp/bot_params.json"

  # ===== GMS API Settings =====
  GMS_CHAT_URL: "https://gms.ssafy.io/gmsapi/api.openai.com/v1/chat/completions"
  GMS_MODEL: "gpt-4o-mini"