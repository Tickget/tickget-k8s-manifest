apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatmap-server-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # 새 Pod를 추가로 생성하지 않음 (리소스 절약)
      maxUnavailable: 1  # 한 번에 1개씩만 업데이트
  selector:
    matchLabels:
      app: seatmap-server
  template:
    metadata:
      labels:
        app: seatmap-server
    spec:
      containers:
      - name: seatmap-server
        image: kkaebu/seatmap-server # Overlays에서 태그 지정
        imagePullPolicy: Always
        ports:
        - containerPort: 8000 # uvicorn 실행 포트
        env:
        - name: TZ  
          value: "Asia/Seoul"
        envFrom:
          - configMapRef:
              name: seatmap-server-config
          - secretRef:
              name: seatmap-server-secret
        resources:
          requests: # 대기 중 최소 리소스, 처리 시 Limits까지 버스트 허용
            memory: "256Mi"
            cpu: "100m"
          limits: # OpenCV/AI 처리 시 필요한 버스트 리소스
            memory: "2Gi"     # 이미지 처리 중 메모리 부족 방지
            cpu: "800m"       # CPU도 원래대로 복원
        readinessProbe:
          httpGet:
            path: /pipeline/health # main_modular.py에 정의된 헬스 체크
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 30        # 5초→30초: 이미지 처리 중에도 응답 시간 확보
          failureThreshold: 5       # 3→5: 일시적 부하 중 재시작 방지
        livenessProbe:
          httpGet:
            path: /pipeline/health
            port: 8000
          initialDelaySeconds: 150
          periodSeconds: 15
          timeoutSeconds: 30        # 5초→30초
          failureThreshold: 5       # 3→5