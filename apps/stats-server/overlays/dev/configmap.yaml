apiVersion: v1
kind: ConfigMap
metadata:
  name: stats-server-config
data:
  # Server
  SERVER_PORT: "8080"
  SPRING_APP_NAME: "stats-server"

  # MySQL (클러스터 내부 - db 네임스페이스, username, password는 Secret에서 주입)
  DB_URL: "jdbc:mysql://mysql.db.svc.cluster.local:3306/tickget_db?serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8"

  # Redis (클러스터 내부 - db 네임스페이스)
  REDIS_HOST: "redis-service.db.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "3000ms"
  REDIS_POOL_MAX_ACTIVE: "20"
  REDIS_POOL_MAX_IDLE: "10"
  REDIS_POOL_MIN_IDLE: "5"

  # MongoDB (클러스터 내부 - db 네임스페이스, 로그 저장용)
  MONGO_URI: "mongodb://tickget:hiiiiky@mongodb.db.svc.cluster.local:27017/ticketing_db?authSource=admin"
  MONGO_DATABASE: "ticketing_db"
  MONGO_AUTO_INDEX: "true"

  # JPA
  JPA_DDL_AUTO: "update"
  HIBERNATE_SHOW_SQL: "false"
  HIBERNATE_FORMAT_SQL: "true"
  HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_OPEN_IN_VIEW: "false"

  # Spring Scheduling
  SCHEDULING_POOL_SIZE: "4"

  # Logging
  LOG_SQL_LEVEL: "info"
  LOG_APP_LEVEL: "info"
  LOG_MONGO_LEVEL: "debug"
  LOG_KAFKA_LEVEL: "info"

  # Actuator (Spring Boot 모니터링)
  ACTUATOR_EXPOSE: "health,info,prometheus"
  ACTUATOR_HEALTH_DETAILS: "always"
