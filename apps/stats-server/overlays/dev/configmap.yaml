apiVersion: v1
kind: ConfigMap
metadata:
  name: stats-server-config
data:
  # Server
  SERVER_PORT: "8080"
  SPRING_APP_NAME: "stats-server"

  # MySQL (외부 Azure DB - username, password는 Secret에서 주입)
  DB_URL: "jdbc:mysql://ssafy-mysql-db.mysql.database.azure.com:3306/S13P31A209?serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=true&useUnicode=true&characterEncoding=utf8"

  # Redis (클러스터 내부 - default 네임스페이스)
  REDIS_HOST: "redis-service.default.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "3000ms"
  REDIS_POOL_MAX_ACTIVE: "20"
  REDIS_POOL_MAX_IDLE: "10"
  REDIS_POOL_MIN_IDLE: "5"

  # MongoDB (외부 Azure DB - 로그 저장용)
  MONGO_URI: "mongodb+srv://S13P31A209:tickget209@ssafy.ngivl.mongodb.net/S13P31A209?authSource=admin"
  MONGO_DATABASE: "S13P31A209"
  MONGO_AUTO_INDEX: "true"

  # JPA
  JPA_DDL_AUTO: "update"
  HIBERNATE_SHOW_SQL: "false"
  HIBERNATE_FORMAT_SQL: "true"
  HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  SPRING_OPEN_IN_VIEW: "false"

  # Spring Scheduling
  SCHEDULING_POOL_SIZE: "4"

  # Logging
  LOG_SQL_LEVEL: "info"
  LOG_APP_LEVEL: "info"
  LOG_MONGO_LEVEL: "debug"
  LOG_KAFKA_LEVEL: "info"

  # Actuator (Spring Boot 모니터링)
  ACTUATOR_EXPOSE: "health,info,prometheus"
  ACTUATOR_HEALTH_DETAILS: "always"
