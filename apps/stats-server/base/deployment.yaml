apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats-server-deployment
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0        # 새 Pod를 추가로 생성하지 않음 (리소스 절약)
      maxUnavailable: 1  # 한 번에 1개씩만 업데이트
  selector:
    matchLabels:
      app: stats-server
  template:
    metadata:
      labels:
        app: stats-server
    spec:
      # Worker1 노드에 고정
      nodeSelector:
        kubernetes.io/hostname: worker1

      containers:
      - name: stats-server
        image: kkaebu/stats-server
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: TZ
          value: "Asia/Seoul"
        envFrom:
          - configMapRef:
              name: stats-server-config
          - secretRef:
              name: stats-server-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "800Mi"
            cpu: "300m"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 150
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
