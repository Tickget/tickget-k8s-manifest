apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-server-config
data:
  # MySQL URL (클러스터 내부 - db 네임스페이스)
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql.db.svc.cluster.local:3306/tickget_db?serverTimezone=Asia/Seoul&connectionTimeZone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false&useUnicode=true&characterEncoding=utf8"
  SPRING_DATASOURCE_DRIVER: "com.mysql.cj.jdbc.Driver"

  # JPA
  SPRING_JPA_DDL_AUTO: "update"

  # Redis (db 네임스페이스 - FQDN)
  SPRING_REDIS_HOST: "redis-service.db.svc.cluster.local"
  SPRING_REDIS_PORT: "6379"

  # Frontend URL
  FRONTEND_URL: "https://tickget.kr"

  # OAuth2 Redirect URI (Google 로그인 후 콜백 URL)
  OAUTH2_REDIRECT_URI: "https://tickget.kr/api/v1/dev/auth/login/oauth2/code/{registrationId}"

  # JWT 토큰 유효기간 (밀리초)
  JWT_ACCESS_TOKEN_VALIDITY: "604800000"    # 7일
  JWT_REFRESH_TOKEN_VALIDITY: "2592000000"  # 30일

  # Logging
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_TICKGET: "DEBUG"
  LOGGING_LEVEL_SECURITY: "DEBUG"

  # MinIO S3 (프로필 이미지 저장)
  MINIO_URL: "https://s3.tickget.kr"
  MINIO_BUCKET_NAME: "tickget-dev"
  MINIO_DEFAULT_PROFILE_COUNT: "4"
