# /03-global-access/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickget-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-ticketing-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: "tickget.kr"  # 또는 "api.tickget.kr" (DNS에 설정한 주소)
    http:
      paths:
      # --- Ticketing API v1 ---
      - path: /api/ticketing
        pathType: Prefix
        backend:
          service:
            name: ticketing-server-service # ticketing-server의 Service 이름
            port:
              number: 80