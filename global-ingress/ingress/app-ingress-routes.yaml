apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tickget-app-routes
  namespace: default
spec:
  entryPoints:
    - websecure # HTTPS
  routes:
    # --- 1. 운영 환경 (Prod / master) ---
    # 경로: /api/v1/tkt/*
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/tkt`)
      kind: Rule
      services:
        - name: ticketing-server-service
          port: 80
          namespace: prod # prod 네임스페이스로 라우팅
      middlewares:
        - name: ticketing-server-middleware # 'prod' 네임스페이스의 미들웨어
          namespace: prod

    # --- 2. 개발 환경 (Dev / dev) ---
    # 경로: /api/v1/dev/tkt/*
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/dev/tkt`)
      kind: Rule
      services:
        - name: ticketing-server-service
          port: 80
          namespace: dev # dev 네임스페이스로 라우팅
      middlewares:
        - name: ticketing-server-middleware # 'dev' 네임스페이스의 미들웨어
          namespace: dev

    # 경로: /api/v1/dev/rms/*
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/dev/rms`)
      kind: Rule
      services:
        - name: room-server-service
          port: 80
          namespace: dev # dev 네임스페이스로 라우팅
      middlewares:
        - name: room-server-middleware # 'dev' 네임스페이스의 미들웨어
          namespace: dev

    # --- 3. 테스트 환경 (Test / test-dev) ---
    # 경로: /api/v1/test/tst/*
    - match: Host(`tickget.kr`) && PathPrefix(`/api/v1/test/tst`)
      kind: Rule
      services:
        - name: test-server-service
          port: 80
          namespace: test # ★ test 네임스페이스로 라우팅
      middlewares:
        - name: test-server-middleware # 'test' 네임스페이스의 미들웨어
          namespace: test

    # --- 4. 프론트엔드 (Frontend) ---
    # 주의: 프론트엔드는 가장 마지막에 선언하되, priority는 적절히 설정

    # Dev 프론트엔드 (기본 - 모든 나머지 경로)
    - match: Host(`tickget.kr`) && PathPrefix(`/`)
      kind: Rule
      priority: 10  # API와 모니터링보다는 낮지만, 기본값(0)보다는 높게
      services:
        - name: frontend-service
          port: 80
          namespace: dev

  # --- TLS (HTTPS) 설정 ---
  tls:
    secretName: tickget-kr-tls # 기존 인증서 Secret 재사용
    # namespace: default #tls가 있는 namespace 명시 