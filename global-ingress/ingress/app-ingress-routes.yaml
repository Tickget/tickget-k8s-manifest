apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tickget-app-routes
  namespace: default
spec:
  entryPoints:
    - websecure # HTTPS
  routes:
    # --- 0. 서비스별 라우팅 분리 ---
    # ⚠️ auth-server: apps/auth-server/overlays/dev/ingress-route.yaml로 이동됨
    # ⚠️ room-server: apps/room-server/overlays/dev/ingress-route.yaml로 이동됨
    # ⚠️ ticketing-server: apps/ticketing-server/overlays/dev/ingress-route.yaml로 이동됨
    # 서비스별 IngressRoute 분리 전략 적용 중

    # Dev 프론트엔드 (기본 - 모든 나머지 경로)
    - match: Host(`tickget.kr`) && PathPrefix(`/`)
      kind: Rule
      priority: 10  # API와 모니터링보다는 낮지만, 기본값(0)보다는 높게
      services:
        - name: frontend-service
          port: 80
          namespace: dev

  # --- TLS (HTTPS) 설정 ---
  tls:
    secretName: tickget-kr-tls # 기존 인증서 Secret 재사용
    # namespace: default #tls가 있는 namespace 명시 