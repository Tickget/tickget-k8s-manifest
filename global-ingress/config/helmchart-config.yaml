apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system # k3s의 Traefik이 설치된 곳
spec:
  # Traefik Helm 차트의 values.yaml에 해당하는 내용을 여기에 적습니다.
  valuesContent: |-
    # 대시보드 활성화 (기본값 true지만 명시)
    dashboard:
      enabled: true
      
    # 대시보드를 위한 IngressRoute를 자동으로 생성하도록 설정
    ingressRoute:
      dashboard:
        enabled: true # IngressRoute 생성 활성화
        # Host(..) 규칙은 이미 ingress.yaml에서 사용 중이므로
        # PathPrefix 규칙만 추가로 설정합니다.
        matchRule: Host(`tickget.kr`) && PathPrefix(`/k3s/traefik/dashboard`)
        entryPoints:
          - web # ingress.yaml과 동일한 entryPoint 사용
        middlewares:
          # /k3s/traefik 경로를 제거해주는 미들웨어를
          # Helm 차트가 '내부적으로' 생성하도록 설정
          - name: traefik-dashboard-stripprefix@internal
            namespace: "" # @internal을 사용할 땐 비워둡니다