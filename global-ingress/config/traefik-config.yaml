# k3s Traefik 대시보드 활성화 설정
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # API 및 대시보드 활성화
    dashboard:
      enabled: true
    
    # 추가 arguments
    additionalArguments:
      - "--api" # Traefik API 활성화
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # --- HTTP to HTTPS 리디렉션 ---
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # --- Prometheus 메트릭 활성화 (아래 2줄 추가) ---
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
    
    # 기본 포트 설정 유지
    ports:
      web:
        port: 80
      websecure:
        port: 443
      # --- 메트릭 수집용 포트 추가 ---
      metrics:
        port: 9100