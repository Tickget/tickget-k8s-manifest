# Traefik Dashboard IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-ingress
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`tickget.kr`) && PathPrefix(`/k3s/traefik`)
    kind: Rule
    middlewares:
      - name: traefik-dashboard-middleware
    services:
    - name: api@internal
      kind: TraefikService