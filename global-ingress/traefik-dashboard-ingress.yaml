# Traefik API 라우트 (/api/* - Traefik API로)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-api-route
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`tickget.kr`) && PathPrefix(`/api`)
    kind: Rule
    priority: 100  # 낮은 우선순위 (나중에 처리)
    services:
    - name: api@internal
      kind: TraefikService

# Traefik Dashboard UI 라우트
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard-ingress
  namespace: kube-system
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`tickget.kr`) && PathPrefix(`/k3s/traefik`)
    kind: Rule
    middlewares:
      - name: traefik-dashboard-middleware
    services:
    - name: api@internal
      kind: TraefikService