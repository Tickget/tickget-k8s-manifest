---
# Grafana TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tickget-kr-tls
  namespace: monitoring
spec:
  secretName: grafana-tickget-kr-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - grafana.tickget.kr
  renewBefore: 360h

---
# Grafana IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.tickget.kr`)
      services:
        - name: grafana-service
          port: 80
  tls:
    secretName: grafana-tickget-kr-tls
