apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
spec:
  selector:
    app: node-exporter
  type: ClusterIP
  clusterIP: None  # Headless service for DaemonSet
  ports:
  - name: metrics
    port: 9100
    targetPort: 9100
    protocol: TCP
