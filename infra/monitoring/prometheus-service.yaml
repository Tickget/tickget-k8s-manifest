apiVersion: v1
kind: Service
metadata:
  name: prometheus-headless
  namespace: monitoring
spec:
  selector:
    app: prometheus
  type: ClusterIP
  clusterIP: None  # Headless service
  ports:
  - name: http
    port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  type: ClusterIP
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
