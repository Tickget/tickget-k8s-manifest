# infra/cert-manager/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Cert-Manager를 원격 리소스로 참조
resources:
# Cert-Manager v1.16.3 공식 매니페스트
- https://github.com/cert-manager/cert-manager/releases/download/v1.16.3/cert-manager.yaml

# 참고: 이 kustomization을 사용하려면:
# kubectl apply -k infra/cert-manager/
