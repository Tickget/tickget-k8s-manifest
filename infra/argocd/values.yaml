# ArgoCD Helm Chart Values
# 커스터마이징이 필요한 경우 이 파일을 수정하여 사용하세요.
#
# 사용법:
# helm install argocd argo/argo-cd \
#   --namespace argocd \
#   --create-namespace \
#   --values infra/argocd/values.yaml

## ArgoCD Server 설정
server:
  # Replicas (고가용성이 필요한 경우 2 이상)
  replicas: 1

  # Service 타입 (ClusterIP 권장, Ingress 사용)
  service:
    type: ClusterIP

  # Ingress 설정 (별도 파일 argocd-ingress.yaml 사용 권장)
  ingress:
    enabled: false  # Traefik IngressRoute 별도 사용

  # Insecure 모드 (Traefik이 TLS 종료 처리하므로 true 권장)
  extraArgs:
    - --insecure

## Application Controller 설정
controller:
  replicas: 1

## Repo Server 설정
repoServer:
  replicas: 1

## Redis 설정
redis:
  enabled: true

## Dex (OAuth2) 설정
dex:
  enabled: true

## Notifications Controller 설정
notifications:
  enabled: true

## ApplicationSet Controller 설정
applicationSet:
  enabled: true
  replicas: 1

## Global 설정
global:
  # 이미지 저장소 (기본값 사용)
  image:
    repository: quay.io/argoproj/argocd
    tag: ""  # Chart의 appVersion 사용

## Config 설정
configs:
  # ConfigMap 파라미터
  params:
    # Server가 insecure 모드로 실행 (Traefik이 TLS 처리)
    server.insecure: true

  # Repository 자격증명 (별도로 UI 또는 CLI에서 추가 권장)
  repositories: {}

  # Secret (민감한 정보는 별도 Secret으로 관리)
  secret:
    createSecret: true

## 리소스 제한 (선택사항)
# server:
#   resources:
#     requests:
#       memory: "256Mi"
#       cpu: "100m"
#     limits:
#       memory: "512Mi"
#       cpu: "500m"
#
# controller:
#   resources:
#     requests:
#       memory: "512Mi"
#       cpu: "250m"
#     limits:
#       memory: "1Gi"
#       cpu: "1000m"
#
# repoServer:
#   resources:
#     requests:
#       memory: "256Mi"
#       cpu: "100m"
#     limits:
#       memory: "512Mi"
#       cpu: "500m"

## NodeSelector (특정 노드에 배포)
# server:
#   nodeSelector:
#     kubernetes.io/hostname: worker1
#
# controller:
#   nodeSelector:
#     kubernetes.io/hostname: worker1
#
# repoServer:
#   nodeSelector:
#     kubernetes.io/hostname: worker1

## 참고:
# - 전체 설정 옵션: https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# - 현재 적용된 값 확인: helm get values argocd -n argocd
# - 업그레이드: helm upgrade argocd argo/argo-cd -n argocd --values infra/argocd/values.yaml
