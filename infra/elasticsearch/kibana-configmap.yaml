apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-config
  namespace: monitoring
data:
  kibana.yml: |
    # Elasticsearch 연결 (default namespace의 서비스)
    elasticsearch.hosts: ["http://elasticsearch-service.default.svc.cluster.local:9200"]

    # 서버 설정
    server.host: "0.0.0.0"
    server.port: 5601
    server.name: "kibana-tickget"
    server.publicBaseUrl: "https://es.tickget.kr"

    # 보안 비활성화 (개발 환경)
    xpack.security.enabled: false
    xpack.encryptedSavedObjects.encryptionKey: "tickget-kibana-encryption-key-min-32-chars"

    # 모니터링 비활성화 (리소스 절약)
    monitoring.ui.enabled: false

    # 한글 지원
    i18n.locale: "ko-KR"

    # 로깅
    logging.root.level: warn
