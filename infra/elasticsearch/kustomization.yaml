apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Elasticsearch는 namespace 지정 안함 (각 파일에서 개별 지정)
# - Elasticsearch: default namespace (공통 인프라)
# - Kibana: monitoring namespace (모니터링 UI)

resources:
  - elasticsearch-configmap.yaml
  - elasticsearch-service.yaml
  - elasticsearch-statefulset.yaml
  - kibana-configmap.yaml
  - kibana-deployment.yaml
  - kibana-service.yaml
  - kibana-ingress.yaml
