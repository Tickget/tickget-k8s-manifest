apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: monitoring
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        # MongoDB 연결 URL (이것이 우선순위가 높음)
        - name: ME_CONFIG_MONGODB_URL
          value: "mongodb://tickget:hiiiiky@mongodb-service.db:27017/ticketing_db?authSource=admin"
        # MongoDB 연결 설정 (URL이 없을 때 사용)
        - name: ME_CONFIG_MONGODB_SERVER
          value: "mongodb-service.db"  # MongoDB 서비스 FQDN (db 네임스페이스)
        - name: ME_CONFIG_MONGODB_PORT
          value: "27017"
        # MongoDB 인증 정보
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: username
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: password
        - name: ME_CONFIG_MONGODB_AUTH_DATABASE
          value: "admin"  # authSource
        # Mongo Express 웹 인증 (브라우저 접속 시 필요)
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "admin"
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "tickget209"
        # 옵션 설정
        - name: ME_CONFIG_OPTIONS_EDITORTHEME
          value: "ambiance"  # 에디터 테마
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
