apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
  namespace: db
  labels:
    app: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-express
  template:
    metadata:
      labels:
        app: mongo-express
    spec:
      containers:
      - name: mongo-express
        image: mongo-express:latest
        ports:
        - containerPort: 8081
          name: http
        env:
        # MongoDB 연결 설정
        - name: ME_CONFIG_MONGODB_SERVER
          value: "mongodb-service"  # MongoDB 서비스 이름
        - name: ME_CONFIG_MONGODB_PORT
          value: "27017"
        # 인증 설정 (MongoDB 인증 정보와 일치해야 함)
        - name: ME_CONFIG_MONGODB_ADMINUSERNAME
          value: "admin"  # MongoDB 관리자 계정
        - name: ME_CONFIG_MONGODB_ADMINPASSWORD
          value: "tickget209"  # MongoDB 관리자 비밀번호
        # Mongo Express 웹 인증 (접속 시 필요)
        - name: ME_CONFIG_BASICAUTH_USERNAME
          value: "admin"
        - name: ME_CONFIG_BASICAUTH_PASSWORD
          value: "tickget209"
        # 옵션 설정
        - name: ME_CONFIG_OPTIONS_EDITORTHEME
          value: "ambiance"  # 에디터 테마
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
