apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: db
spec:
  selector:
    app: mysql
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
