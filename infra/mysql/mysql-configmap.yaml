apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: db
data:
  my.cnf: |
    [mysqld]
    # Character Set
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

    # Timezone
    default-time-zone='+09:00'

    # Connection Settings
    max_connections=200
    max_allowed_packet=64M

    # Performance
    innodb_buffer_pool_size=512M
    innodb_log_file_size=128M
    innodb_flush_log_at_trx_commit=2
    innodb_flush_method=O_DIRECT

    # Logs
    slow_query_log=1
    slow_query_log_file=/var/lib/mysql/slow-query.log
    long_query_time=2

    # Binary Log (for replication, can be disabled if not needed)
    # log_bin=mysql-bin
    # binlog_format=ROW
    # expire_logs_days=7

    [client]
    default-character-set=utf8mb4
