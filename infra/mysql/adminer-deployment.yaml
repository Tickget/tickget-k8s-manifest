apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: db
  labels:
    app: adminer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adminer
  template:
    metadata:
      labels:
        app: adminer
    spec:
      containers:
      - name: adminer
        image: adminer:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        # Adminer 기본 설정
        - name: ADMINER_DEFAULT_SERVER
          value: "mysql-service"  # MySQL 서비스 이름
        - name: ADMINER_DESIGN
          value: "pepa-linha"  # 깔끔한 테마
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
