---
# MinIO S3 API TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-tickget-kr-tls
  namespace: db
spec:
  secretName: s3-tickget-kr-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - s3.tickget.kr
  renewBefore: 360h

---
# MinIO Console TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-console-tickget-kr-tls
  namespace: db
spec:
  secretName: s3-console-tickget-kr-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - s3-console.tickget.kr
  renewBefore: 360h

---
# MinIO S3 API IngressRoute (포트 9000)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-s3-api-ingress
  namespace: db
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3.tickget.kr`)
      services:
        - name: minio-service
          port: 9000
  tls:
    secretName: s3-tickget-kr-tls

---
# MinIO Console IngressRoute (포트 9001)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console-ingress
  namespace: db
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3-console.tickget.kr`)
      services:
        - name: minio-service
          port: 9001
  tls:
    secretName: s3-console-tickget-kr-tls
