---
# Redis Commander TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redis-tickget-kr-tls
  namespace: monitoring
spec:
  secretName: redis-tickget-kr-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - redis.tickget.kr
  renewBefore: 360h

---
# Redis Commander IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: redis-commander-ingress
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`redis.tickget.kr`)
      kind: Rule
      services:
        - name: redis-commander-service
          port: 80
          namespace: monitoring
  tls:
    secretName: redis-tickget-kr-tls
