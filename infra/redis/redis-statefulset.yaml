apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-statefulset
  namespace: db
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker1 # 워커1에 고정
      containers:
      - name: redis
        image: redis:7-alpine
        command: ["redis-server", "/etc/redis/redis.conf"]
        env:
        - name: TZ
          value: "Asia/Seoul"
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "4Gi"
          limits:
            memory: "5Gi" # ConfigMap의 maxmemory보다 넉넉하게
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        - name: redis-config-volume
          mountPath: /etc/redis/
        - name: timezone
          mountPath: /etc/localtime
          readOnly: true
        - name: zoneinfo
          mountPath: /usr/share/zoneinfo
          readOnly: true
      volumes:
      - name: redis-config-volume
        configMap:
          name: redis-config
      - name: timezone
        hostPath:
          path: /etc/localtime
          type: File
      - name: zoneinfo
        hostPath:
          path: /usr/share/zoneinfo
          type: Directory
  volumeClaimTemplates:
  - metadata:
      name: redis-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 10Gi